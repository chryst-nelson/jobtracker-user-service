spring.application.name=jobtracker-user-service
server.port=8081

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobtrackerdb}
spring.datasource.username=${DATASOURCE_USERNAME:myuser}
spring.datasource.password=${DATASOURCE_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:super-secret-key-for-development-only-32chars}
app.jwt.expiration=${JWT_EXPIRATION:86400000}